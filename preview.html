<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CS 定时炸弹模拟器</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at center, #2d2d2d 0%, #111 55%, #050505 100%);
    font-family: Consolas, Monaco, monospace;
    color: #eee;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .bomb {
    width: 420px;
    max-width: 92vw;
    background: linear-gradient(145deg, #222, #111);
    border: 4px solid #444;
    border-radius: 18px;
    padding: 24px;
    box-shadow:
      0 0 40px rgba(255, 0, 0, 0.25),
      inset 0 0 20px rgba(0, 0, 0, 0.8);
    position: relative;
    z-index: 2;
  }

  .bomb::before,
  .bomb::after {
    content: "";
    position: absolute;
    height: 10px;
    width: 160px;
    background: repeating-linear-gradient(
      90deg,
      #900,
      #900 14px,
      #222 14px,
      #222 22px
    );
    border-radius: 10px;
    top: -24px;
  }

  .bomb::before {
    left: 35px;
    transform: rotate(-8deg);
  }

  .bomb::after {
    right: 35px;
    transform: rotate(8deg);
  }

  .title {
    text-align: center;
    color: #ff3333;
    font-size: 22px;
    letter-spacing: 3px;
    margin-bottom: 18px;
    text-shadow: 0 0 12px #f00;
  }

  .screen {
    background: #050805;
    border: 3px solid #333;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: inset 0 0 18px #000;
  }

  .timer {
    font-size: 64px;
    text-align: center;
    color: #ff2a2a;
    text-shadow: 0 0 18px #f00;
    margin-bottom: 8px;
  }

  .status {
    text-align: center;
    min-height: 24px;
    color: #9cff9c;
    font-size: 14px;
  }

  .panel {
    display: grid;
    gap: 12px;
  }

  input {
    width: 100%;
    padding: 14px;
    background: #080808;
    border: 2px solid #444;
    color: #00ff66;
    border-radius: 8px;
    font-size: 20px;
    font-family: inherit;
    outline: none;
    text-align: center;
    letter-spacing: 4px;
  }

  input:focus {
    border-color: #00ff66;
    box-shadow: 0 0 12px rgba(0, 255, 100, 0.35);
  }

  button {
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #222;
    color: #eee;
    font-size: 16px;
    font-family: inherit;
    cursor: pointer;
    transition: 0.15s;
  }

  button:hover {
    background: #333;
    transform: translateY(-1px);
  }

  .arm {
    background: #8b0000;
    color: white;
    font-weight: bold;
  }

  .arm:hover {
    background: #c40000;
  }

  .defuse {
    background: #006b2d;
    color: white;
    font-weight: bold;
  }

  .defuse:hover {
    background: #009944;
  }

  .hidden {
    display: none;
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 6px;
  }

  .keypad button {
    background: #1b1b1b;
    border: 1px solid #555;
    font-size: 20px;
  }

  .keypad button:hover {
    background: #333;
  }

  .danger {
    animation: flash 0.3s infinite alternate;
  }

  .critical {
    animation: criticalFlash 0.15s infinite alternate;
  }

  .defused {
    box-shadow:
      0 0 45px rgba(0, 255, 100, 0.45),
      inset 0 0 20px rgba(0, 0, 0, 0.8);
  }

  .exploded-bomb {
    box-shadow:
      0 0 90px rgba(255, 90, 0, 0.9),
      inset 0 0 30px rgba(255, 0, 0, 0.8);
    filter: contrast(1.4) brightness(1.3);
  }

  .hint {
    color: #aaa;
    font-size: 12px;
    text-align: center;
    margin-top: 14px;
    line-height: 1.5;
  }

  @keyframes flash {
    from {
      color: #ff2a2a;
      text-shadow: 0 0 12px red;
    }
    to {
      color: #fff;
      text-shadow: 0 0 25px #ff0000;
    }
  }

  @keyframes criticalFlash {
    from {
      color: #ff0000;
      transform: scale(1);
      text-shadow: 0 0 15px red;
    }
    to {
      color: #ffffff;
      transform: scale(1.08);
      text-shadow: 0 0 32px #ff0000;
    }
  }

  body.shake {
    animation: bodyShake 0.55s linear 3;
  }

  @keyframes bodyShake {
    0% { transform: translate(0, 0); }
    10% { transform: translate(-8px, 6px); }
    20% { transform: translate(10px, -6px); }
    30% { transform: translate(-12px, -8px); }
    40% { transform: translate(12px, 8px); }
    50% { transform: translate(-8px, 4px); }
    60% { transform: translate(8px, -4px); }
    70% { transform: translate(-5px, -5px); }
    80% { transform: translate(5px, 5px); }
    90% { transform: translate(-2px, 2px); }
    100% { transform: translate(0, 0); }
  }

  #effectsLayer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    overflow: hidden;
  }

  .flashOverlay {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at center, #fff 0%, #ffcc00 12%, #ff3300 28%, rgba(0,0,0,0.9) 72%);
    animation: flashOverlayAnim 1.4s ease-out forwards;
  }

  @keyframes flashOverlayAnim {
    0% {
      opacity: 1;
      transform: scale(0.2);
      filter: brightness(2.8);
    }
    35% {
      opacity: 0.95;
      transform: scale(1.4);
      filter: brightness(1.8);
    }
    100% {
      opacity: 0;
      transform: scale(2.2);
      filter: brightness(0.6);
    }
  }

  .shockwave {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 80px;
    height: 80px;
    border: 4px solid rgba(255, 230, 120, 0.9);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: shockwaveAnim 1s ease-out forwards;
  }

  @keyframes shockwaveAnim {
    from {
      width: 80px;
      height: 80px;
      opacity: 1;
    }
    to {
      width: 1300px;
      height: 1300px;
      opacity: 0;
    }
  }

  .debris {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    background: #ffcc33;
    box-shadow: 0 0 12px rgba(255, 100, 0, 0.9);
    animation: debrisFly 1.3s ease-out forwards;
  }

  @keyframes debrisFly {
    from {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }
    to {
      transform:
        translate(
          calc(-50% + var(--x)),
          calc(-50% + var(--y))
        )
        rotate(var(--r))
        scale(0.2);
      opacity: 0;
    }
  }

  .smoke {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(80, 80, 80, 0.45);
    filter: blur(3px);
    animation: smokeRise 2.4s ease-out forwards;
  }

  @keyframes smokeRise {
    from {
      transform: translate(-50%, -50%) scale(0.7);
      opacity: 0.8;
    }
    to {
      transform:
        translate(
          calc(-50% + var(--x)),
          calc(-50% + var(--y))
        )
        scale(5);
      opacity: 0;
    }
  }
</style>
</head>

<body>
  <div id="effectsLayer"></div>

  <div class="bomb" id="bomb">
    <div class="title">C4 DEVICE</div>

    <div class="screen">
      <div class="timer" id="timer">00:40</div>
      <div class="status" id="status">输入密码，然后启动炸弹</div>
    </div>

    <div class="panel">
      <input
        id="mainInput"
        type="password"
        readonly
        placeholder="设置密码"
      />

      <div class="keypad">
        <button data-key="1">1</button>
        <button data-key="2">2</button>
        <button data-key="3">3</button>
        <button data-key="4">4</button>
        <button data-key="5">5</button>
        <button data-key="6">6</button>
        <button data-key="7">7</button>
        <button data-key="8">8</button>
        <button data-key="9">9</button>
        <button data-key="DEL">DEL</button>
        <button data-key="0">0</button>
        <button data-key="OK">OK</button>
      </div>

      <button class="arm" id="armBtn">启动炸弹</button>
      <button class="defuse hidden" id="defuseBtn">拆除炸弹</button>
    </div>

    <div class="hint">
      同一个输入框：未启动时设置密码，启动后输入拆弹密码。<br />
      OK 键：未启动时启动炸弹，启动后尝试拆除炸弹。<br />
      最后 10 秒蜂鸣加速，爆炸后有闪光、震动、冲击波和碎片效果。
    </div>
  </div>

<script>
  const timerEl = document.getElementById("timer");
  const statusEl = document.getElementById("status");
  const mainInput = document.getElementById("mainInput");
  const armBtn = document.getElementById("armBtn");
  const defuseBtn = document.getElementById("defuseBtn");
  const bombEl = document.getElementById("bomb");
  const keypad = document.querySelector(".keypad");
  const effectsLayer = document.getElementById("effectsLayer");

  let password = "";
  let timeLeft = 40;
  let countdownTimer = null;
  let beepTimer = null;
  let armed = false;
  let finished = false;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  function speakLine(text, delay = 0) {
    if (!("speechSynthesis" in window)) return;

    setTimeout(() => {
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";
      utterance.rate = 0.85;
      utterance.pitch = 0.7;
      utterance.volume = 1;

      window.speechSynthesis.speak(utterance);
    }, delay);
  }

  function playTone(freq, duration, type = "square", volume = 0.16) {
    if (!audioCtx) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  function playKeySound() {
    playTone(520, 0.045, "square", 0.08);
  }

  function playErrorSound() {
    playTone(180, 0.18, "sawtooth", 0.22);
    setTimeout(() => playTone(130, 0.18, "sawtooth", 0.18), 120);
  }

  function playPlantSound() {
    playTone(600, 0.08, "square", 0.14);
    setTimeout(() => playTone(750, 0.08, "square", 0.14), 110);
    setTimeout(() => playTone(900, 0.12, "square", 0.16), 220);
  }

  function playDefuseSound() {
    playTone(523, 0.12, "sine", 0.16);
    setTimeout(() => playTone(659, 0.12, "sine", 0.16), 130);
    setTimeout(() => playTone(784, 0.24, "sine", 0.18), 260);
  }

  function playBeep() {
    if (!armed || finished) return;

    if (timeLeft <= 10) {
      const freq = 900 + (10 - timeLeft) * 65;
      playTone(freq, 0.055, "square", 0.24);

      if (timeLeft <= 5) {
        setTimeout(() => {
          if (armed && !finished) {
            playTone(freq + 180, 0.045, "square", 0.2);
          }
        }, 85);
      }
    } else {
      playTone(650, 0.075, "square", 0.14);
    }
  }

  function getBeepDelay() {
    if (timeLeft > 10) return 1000;
    return Math.max(80, timeLeft * 70);
  }

  function startBeepLoop() {
    clearTimeout(beepTimer);

    function loop() {
      if (!armed || finished) return;
      playBeep();
      beepTimer = setTimeout(loop, getBeepDelay());
    }

    loop();
  }

  function stopBeepLoop() {
    clearTimeout(beepTimer);
    beepTimer = null;
  }

  function playExplosionSound() {
    if (!audioCtx) return;

    const duration = 1.4;
    const bufferSize = audioCtx.sampleRate * duration;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);

    for (let i = 0; i < bufferSize; i++) {
      const decay = 1 - i / bufferSize;
      data[i] = (Math.random() * 2 - 1) * decay * decay;
    }

    const noise = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    filter.type = "lowpass";
    filter.frequency.setValueAtTime(500, audioCtx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + duration);

    gain.gain.setValueAtTime(1.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

    noise.buffer = buffer;
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    noise.start();

    playTone(75, 0.9, "sawtooth", 0.45);
    setTimeout(() => playTone(45, 1.0, "sawtooth", 0.28), 120);
  }

  function createExplosionVisual() {
    effectsLayer.innerHTML = "";

    const flash = document.createElement("div");
    flash.className = "flashOverlay";
    effectsLayer.appendChild(flash);

    const shockwave = document.createElement("div");
    shockwave.className = "shockwave";
    effectsLayer.appendChild(shockwave);

    for (let i = 0; i < 90; i++) {
      const debris = document.createElement("div");
      debris.className = "debris";

      const angle = Math.random() * Math.PI * 2;
      const distance = 180 + Math.random() * 620;
      const x = Math.cos(angle) * distance;
      const y = Math.sin(angle) * distance;

      debris.style.setProperty("--x", `${x}px`);
      debris.style.setProperty("--y", `${y}px`);
      debris.style.setProperty("--r", `${Math.random() * 1080}deg`);

      const size = 4 + Math.random() * 10;
      debris.style.width = `${size}px`;
      debris.style.height = `${size}px`;

      const colors = ["#ffcc33", "#ff6600", "#ff3300", "#555", "#222"];
      debris.style.background = colors[Math.floor(Math.random() * colors.length)];

      effectsLayer.appendChild(debris);
    }

    for (let i = 0; i < 38; i++) {
      const smoke = document.createElement("div");
      smoke.className = "smoke";

      const angle = Math.random() * Math.PI * 2;
      const distance = 40 + Math.random() * 240;
      const x = Math.cos(angle) * distance;
      const y = Math.sin(angle) * distance - 160;

      smoke.style.setProperty("--x", `${x}px`);
      smoke.style.setProperty("--y", `${y}px`);

      effectsLayer.appendChild(smoke);
    }

    document.body.classList.add("shake");

    setTimeout(() => {
      document.body.classList.remove("shake");
    }, 1800);

    setTimeout(() => {
      effectsLayer.innerHTML = "";
    }, 2600);
  }

  function formatTime(seconds) {
    return "00:" + String(seconds).padStart(2, "0");
  }

  function resetVisualState() {
    bombEl.classList.remove("defused", "exploded-bomb");
    timerEl.classList.remove("danger", "critical");
    document.body.classList.remove("shake");
    effectsLayer.innerHTML = "";
  }

  function updateInputMode() {
    if (!armed && !finished) {
      mainInput.placeholder = "设置密码";
      armBtn.classList.remove("hidden");
      defuseBtn.classList.add("hidden");
      return;
    }

    if (armed && !finished) {
      mainInput.placeholder = "输入拆弹密码";
      armBtn.classList.add("hidden");
      defuseBtn.classList.remove("hidden");
      return;
    }

    if (finished) {
      mainInput.placeholder = "重新设置密码";
      armBtn.classList.remove("hidden");
      defuseBtn.classList.add("hidden");
    }
  }

  function armBomb() {
    initAudio();

    if (armed && !finished) {
      statusEl.textContent = "炸弹已经启动";
      statusEl.style.color = "#ffcc00";
      playErrorSound();
      return;
    }

    password = mainInput.value.trim();

    if (!password) {
      statusEl.textContent = "必须先输入密码";
      statusEl.style.color = "#ffcc00";
      playErrorSound();
      return;
    }

    clearInterval(countdownTimer);
    stopBeepLoop();
    resetVisualState();

    timeLeft = 40;
    armed = true;
    finished = false;

    mainInput.value = "";
    updateInputMode();

    timerEl.textContent = formatTime(timeLeft);
    statusEl.textContent = "炸弹已启动";
    statusEl.style.color = "#ff3333";

    playPlantSound();
    speakLine("The bomb has been planted.", 250);

    startBeepLoop();

    countdownTimer = setInterval(() => {
      if (!armed || finished) return;

      timeLeft--;
      timerEl.textContent = formatTime(timeLeft);

      if (timeLeft <= 10) {
        timerEl.classList.add("danger");
        statusEl.textContent = "警告：最后 10 秒";
        statusEl.style.color = "#ff3333";
      }

      if (timeLeft <= 5) {
        timerEl.classList.add("critical");
        statusEl.textContent = "极度危险：即将爆炸";
      }

      if (timeLeft <= 0) {
        explode();
      }
    }, 1000);
  }

  function defuseBomb() {
    initAudio();

    if (!armed || finished) {
      statusEl.textContent = "炸弹尚未启动";
      statusEl.style.color = "#aaa";
      playErrorSound();
      return;
    }

    if (mainInput.value === password) {
      finished = true;
      armed = false;

      clearInterval(countdownTimer);
      stopBeepLoop();

      timerEl.classList.remove("danger", "critical");
      bombEl.classList.add("defused");

      statusEl.textContent = "炸弹已拆除";
      statusEl.style.color = "#00ff66";

      mainInput.value = "";
      updateInputMode();

      playDefuseSound();
      speakLine("Bomb has been defused.", 100);
      speakLine("Counter-Terrorists win.", 1500);
    } else {
      statusEl.textContent = "密码错误";
      statusEl.style.color = "#ffcc00";
      mainInput.value = "";
      playErrorSound();
    }
  }

  function explode() {
    if (finished) return;

    finished = true;
    armed = false;

    clearInterval(countdownTimer);
    stopBeepLoop();

    timerEl.textContent = "BOOM";
    timerEl.classList.remove("danger");
    timerEl.classList.add("critical");

    statusEl.textContent = "炸弹爆炸";
    statusEl.style.color = "#fff";

    mainInput.value = "";
    updateInputMode();

    bombEl.classList.add("exploded-bomb");

    playExplosionSound();
    createExplosionVisual();

    speakLine("Terrorists win.", 900);
  }

  function pressKey(key) {
    initAudio();

    if (key === "DEL") {
      mainInput.value = mainInput.value.slice(0, -1);
      playTone(300, 0.04, "square", 0.08);
      return;
    }

    if (key === "OK") {
      if (armed && !finished) {
        defuseBomb();
      } else {
        armBomb();
      }
      return;
    }

    if (/^\d$/.test(key)) {
      mainInput.value += key;
      playKeySound();
    }
  }

  armBtn.addEventListener("click", armBomb);
  defuseBtn.addEventListener("click", defuseBomb);

  keypad.addEventListener("click", (e) => {
    const key = e.target.dataset.key;
    if (!key) return;
    pressKey(key);
  });

  document.addEventListener("keydown", (e) => {
    if (/^\d$/.test(e.key)) {
      pressKey(e.key);
    }

    if (e.key === "Backspace") {
      pressKey("DEL");
    }

    if (e.key === "Enter") {
      pressKey("OK");
    }
  });

  updateInputMode();
</script>
</body>
</html>
